name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读权限即可，遵循最小权限原则
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # test_rag.py 需要运行中的 Ollama 和已下载的 embedding 模型，
      # 不适合放在无 GPU/无模型的 CI 里；其余测试全部使用 mock。
      - name: Run test suite
        env:
          # conftest.py 也会设置，这里显式给出以免被意外覆盖
          SECRET_KEY: ci-test-secret-key-32-bytes-minimum
          RATE_LIMIT_ENABLED: "false"
        run: python -m pytest tests/ --ignore=tests/test_rag.py -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

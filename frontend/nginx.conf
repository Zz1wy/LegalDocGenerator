# ===== 前端容器专用 Nginx 配置 =====
# 由 frontend/Dockerfile 复制到 /etc/nginx/conf.d/default.conf。
# 该目录下的文件会被镜像自带的 /etc/nginx/nginx.conf 在 http {} 中 include，
# 因此这里只能写 server {} 块，不能再出现 events {} / http {}。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 请求体上限。后端还有字段级校验，这里只是第一道闸门。
    client_max_body_size 2m;

    # Gzip 压缩（减少传输体积，加快加载速度）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA 路由支持：所有非文件路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend:8000/api/;

        # HTTP/1.1 是 SSE 长连接的前提
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端据此还原真实客户端 IP（TRUST_PROXY_HEADERS=true 时生效）。
        # 缺少这一行时，所有用户会共享 Nginx 容器的 IP，限流变成全站共用一个桶。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键配置：关闭缓冲，否则 token 会攒在 Nginx 里，
        # 前端看到的仍是「生成完一次性出现」。
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;

        # AI 生成可能比较慢
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # 健康检查
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # 静态资源缓存（带 hash 的文件可以长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        # location 中出现 add_header 后不再继承 server 级配置，故重复声明
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}

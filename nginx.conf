# ===== 独立部署参考配置（standalone reference）=====
#
# ⚠️ 本项目 docker-compose 实际使用的是 frontend/nginx.conf
#    （它会被复制进前端容器的 /etc/nginx/conf.d/default.conf）。
#
# 本文件是「不用 Docker、单独装 Nginx 做反向代理」时的完整配置参考，
# 包含 events {} / http {} 顶层块，适合通过 `nginx -c /path/to/nginx.conf`
# 使用。修改容器部署行为请改 frontend/nginx.conf。

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----- 性能优化 -----
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # ----- Gzip 压缩 -----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 6;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 2m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # 前端静态文件
        location / {
            try_files $uri $uri/ /index.html;  # SPA 路由支持
        }

        # 后端 API 代理
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE：必须关闭缓冲，否则流式输出会退化成一次性返回
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;

            # 超时设置（AI 生成可能比较慢）
            proxy_read_timeout 180s;
            proxy_connect_timeout 10s;
        }

        # 健康检查
        location = /health {
            proxy_pass http://backend:8000/health;
            proxy_set_header Host $host;
        }

        # 静态资源长期缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }
}
